---
name: Build macOS
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.0

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          workflowPreset: ci-macos

      - name: Stage installer artifacts
        run: |
          mkdir -p dist
          cp ../srcML-build/dist/*.pkg ../srcML-build/dist/*.tar.gz ../srcML-build/dist/*.tar.bz2 dist/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macOS Package
          path: |
            dist/*.pkg
            dist/*.tar.gz
            dist/*.tar.bz2
