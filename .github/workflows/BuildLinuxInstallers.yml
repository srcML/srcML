---
name: Build Linux Installers

on:
  workflow_dispatch:
    inputs:
      srcml_bake_src:
        description: 'Override SRCML_BAKE_SRC (e.g. https://github.com/srcML/srcML.git#develop). Leave blank to use the default from docker-bake.hcl.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  bake:
    name: bake-${{ matrix.family }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: ubuntu
            arch: amd64
            runner: ubuntu-24.04
          - family: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bake ${{ matrix.family }} package targets
        run: |
          if [[ -n "$INPUT_SRCML_BAKE_SRC" ]]; then
            export SRCML_BAKE_SRC="$INPUT_SRCML_BAKE_SRC"
          fi
          docker buildx bake \
            --set "*.push=false" \
            ubuntu_26_04_package
        env:
          SRCML_BAKE_ARCHITECTURE: linux/${{ matrix.arch }}
          INPUT_SRCML_BAKE_SRC: ${{ inputs.srcml_bake_src }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers-${{ matrix.family }}-${{ matrix.arch }}
          path: |
            dist_packages/*.deb
            dist_packages/*.rpm
            dist_packages/*.tar.gz
            dist_packages/*.bz2
          if-no-files-found: error

  client-image:
    name: client-image-${{ matrix.arch }}
    needs: bake
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download ubuntu installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installers-ubuntu-${{ matrix.arch }}
          path: client-ctx

      - name: Stage Dockerfile
        run: cp docker/ubuntu/client.Dockerfile client-ctx/Dockerfile

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and smoke-test
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --tag srcml-client:smoke \
            --load \
            client-ctx
          docker run --rm srcml-client:smoke -c 'srcml --version'

      - name: Push by digest
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --output "type=image,name=srcml/ubuntu,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            client-ctx
          mkdir -p digests
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: client-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  client-manifest:
    name: client-manifest
    needs: client-image
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: client-digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: digests
        run: |
          docker buildx imagetools create \
            --tag srcml/ubuntu:srcml-v1.1.0-26.04 \
            $(printf 'srcml/ubuntu@sha256:%s ' *)
