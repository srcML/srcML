version: 2.1
orbs:
  windows: circleci/windows@5.1.1
jobs:
    build_ubuntu:
      docker:
        - image: srcml/ubuntu:latest
      steps:
        - run: apt-get update
        - run: apt-get install -y ssh
        - checkout
        - run: cmake --workflow --preset ci-ubuntu
        - store_test_results:
            path: /root/project-build/dist/

    build_fedora:
      docker:
        - image: srcml/fedora:latest
      steps:
        - checkout
        - run: cmake --workflow --preset ci-rpm
        - store_test_results:
            path: /root/project-build/dist/

    build_windows:
      executor: win/server-2025
      steps:
        - checkout
        - run: Write-Host 'Hello, Windows'
        - run: cmake --version

workflows:
  version: 2
  build_and_test:
    jobs:
      # - build_ubuntu
      # - build_fedora
      - build_windows
