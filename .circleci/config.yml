version: 2.1
orbs:
  windows: circleci/windows@5.1.1
jobs:
    build_ubuntu:
      docker:
        - image: srcml/ubuntu:latest
      steps:
        - run: apt-get update
        - run: apt-get install -y ssh
        - checkout
        - run: cmake --workflow --preset ci-ubuntu
        - store_test_results:
            path: /root/project-build/dist/

    build_fedora:
      docker:
        - image: srcml/fedora:latest
      steps:
        - checkout
        - run: cmake --workflow --preset ci-rpm
        - store_test_results:
            path: /root/project-build/dist/

    build_windows:
      executor: windows/server-2025
      steps:
        - checkout
        - run: choco install cmake -y
        # - run: $env:Path+=";$Env:ProgramFiles\CMake\bin"
        - run: cmake --version
        - run: git clone https://github.com/microsoft/vcpkg.git; cd vcpkg; .\bootstrap-vcpkg.bat
        - run: $env:VCPKG_ROOT = $pwd\vcpkg; $env:PATH = "$env:VCPKG_ROOT;$env:PATH"; cmake --workflow --preset ci-msvc

workflows:
  version: 2
  build_and_test:
    jobs:
      # - build_ubuntu
      # - build_fedora
      - build_windows
