version: 2
jobs:
    build_ubuntu:
      docker:
        - image: srcml/ubuntu:latest
      steps:
        - run: apt-get update
        - run: apt-get install -y ssh
        - checkout
        - run: cmake --workflow --preset ci-ubuntu
        - store_test_results:
            path: /root/project-build/dist/

    build_fedora:
      docker:
        - image: srcml/fedora:latest
      steps:
        - checkout
        - run: cmake --workflow --preset ci-rpm
        - store_test_results:
            path: /root/project-build/dist/

    build_windows:
      machine:
        - image: windows-server-2025-gui:current
      steps:
        - checkout
        - run: cmake --workflow --preset ci-msvc

workflows:
  version: 2
  build_and_test:
    jobs:
      # - build_ubuntu
      # - build_fedora
      - build_windows
